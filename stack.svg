  <text x="70" y="164" class="muted" font-size="18">A focused stack for building secure, persistent, testable REST services.</text>
</g>
<!-- subtle orbit elements -->
<g fill="none" stroke="#247bff" stroke-opacity=".20" stroke-width="1.2" transform="translate(915,355)">
