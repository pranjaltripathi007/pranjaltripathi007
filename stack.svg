<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 680" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Pranjal Tripathi — Technology Stack</title><desc id="desc">Grouped languages, backend technologies, database, tools, and core concepts.</desc><defs>
      <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff" stop-opacity=".8"/><stop offset=".48" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ff354f" stop-opacity=".75"/></linearGradient>
      <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#2f9bff"/></linearGradient>
      <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff354f"/><stop offset="1" stop-color="#ff6b7d"/></linearGradient>
      <radialGradient id="orbBlue"><stop offset="0" stop-color="#247bff" stop-opacity=".30"/><stop offset="1" stop-color="#247bff" stop-opacity="0"/></radialGradient>
      <radialGradient id="orbRed"><stop offset="0" stop-color="#ff354f" stop-opacity=".20"/><stop offset="1" stop-color="#ff354f" stop-opacity="0"/></radialGradient>
      <filter id="glowBlue" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="glowRed" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      
    </defs><style>
:root { color-scheme: dark; }
.bg { fill:#070b16; }
.text { fill:#f4f7fb; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.muted { fill:#9ca7b8; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
.eyebrow { fill:#7f8ba0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:14px; font-weight:700; letter-spacing:2.6px; }
.label { fill:#6f7b90; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:12px; font-weight:700; letter-spacing:1.8px; }
.card { fill:#0d1322; stroke:url(#grad); stroke-width:1.25; }
.chip { fill:#0c1220; stroke:#1e2a3c; stroke-width:1; }
.blue { fill:#247bff; }
.red { fill:#ff354f; }
.green { fill:#a8d63b; }
.line { stroke:#1b2740; stroke-width:1; }
.glowBlue { filter:url(#glowBlue); }
.glowRed { filter:url(#glowRed); }
.enter { transform-box:fill-box; transform-origin:center; animation: rise .9s cubic-bezier(.2,.7,.2,1) .1s both; }
.enter2 { transform-box:fill-box; transform-origin:center; animation: rise .9s cubic-bezier(.2,.7,.2,1) .3s both; }
@keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
@media (prefers-reduced-motion: reduce) { .enter,.enter2 { animation:none; opacity:1; transform:none; } .animated-role,.animated-slide,.animated-meter { visibility:hidden; } .rm-static { visibility:visible !important; } }
</style>
<rect class="bg" width="1200" height="680" rx="28"/>
<circle cx="980" cy="90" r="240" fill="url(#orbBlue)"/><circle cx="210" cy="610" r="240" fill="url(#orbRed)"/>
